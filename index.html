<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>João Castelo Branco, ABC</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #0e0e10;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f0f0ee;
      --dim: #9a9aa0;
      --muted: #5a5a60;
      --accent: #c8a97e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }

    /* ================= HEADER MINIMALISTA ================= */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0.78) 0%, rgba(5, 5, 5, 0.35) 65%, rgba(5, 5, 5, 0) 100%);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    header.solid-header {
      background: rgba(5, 5, 5, 0.96);
      border-bottom: 1px solid var(--border);
    }

    .nav-bar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.35rem 2.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand {
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
    }

    nav.menu {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.55rem;
    }

    .nav-link {
      background: none;
      border: none;
      color: rgba(240, 240, 238, 0.76);
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
      letter-spacing: 0.05em;
      padding-bottom: 0.2rem;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
    }

    .nav-link.active {
      border-bottom-color: var(--accent);
    }

    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding-left: 1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 0.74rem;
      color: var(--muted);
    }

    .lang-btn {
      background: none;
      border: none;
      color: rgba(240, 240, 238, 0.65);
      cursor: pointer;
      font-size: 0.74rem;
      font-family: inherit;
      letter-spacing: 0.06em;
    }

    .lang-btn.active {
      color: var(--text);
      font-weight: 600;
    }

    /* ================= VIEWS ================= */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* ================= HOME FULL-BLEED RANDOM CAROUSEL ================= */
    .home-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #050505;
      cursor: pointer;
      user-select: none;
    }

    .home-frame-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
